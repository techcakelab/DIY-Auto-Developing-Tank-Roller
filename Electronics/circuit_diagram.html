<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Film Rotator – Clean Architecture Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e4e7eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #1a202c;
  }
  svg {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  .block { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 4; }
  .bus-power { stroke-width: 3.5; fill: none; }
  .wire { stroke-width: 2; fill: none; }
  .wire-dashed { stroke-width: 2; fill: none; stroke-dasharray: 6,4; }
  .junction { fill: currentColor; }
  text { fill: #0f172a; font-size: 11px; }
  .title { font-weight: 700; font-size: 12px; }
  .lbl { font-size: 10px; font-weight: 600; }
  
  /* Colors */
  .c-12v { stroke: #dc2626; color: #dc2626; } /* Red 12V */
  .c-5v  { stroke: #ea580c; color: #ea580c; } /* Orange/Red 5V */
  .c-gnd { stroke: #0f172a; color: #0f172a; } /* Black GND */
  .c-dig { stroke: #2563eb; color: #2563eb; } /* Blue Digital */
  .c-i2c { stroke: #d97706; color: #d97706; } /* Amber I2C */
  .c-ha  { stroke: #ca8a04; color: #ca8a04; } /* Yellow Hall A */
  .c-hb  { stroke: #16a34a; color: #16a34a; } /* Green Hall B */
  .c-m1  { stroke: #dc2626; color: #dc2626; } /* Motor + Red */
  .c-m2  { stroke: #94a3b8; color: #94a3b8; } /* Motor - White/Gray */
</style>
</head>
<body>
<h1>ESP32 Film Rotator – Clean Architecture Diagram</h1>

<svg viewBox="0 0 1000 740" width="1000" height="740" xmlns="http://www.w3.org/2000/svg">

<!-- ── BACKGROUND GRID ── -->
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0L0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1000" height="740" fill="url(#grid)"/>

<!-- ==========================================
     POWER BUS ARCHITECTURE (TOP)
     y=100: 12V (Red)
     y=110: 5V (Orange/Red)
     y=120: GND (Black)
=========================================== -->
<!-- 12V Bus Line -->
<line x1="80" y1="100" x2="480" y2="100" class="bus-power c-12v"/>
<text x="80" y="94" class="lbl c-12v">12V BUS</text>

<!-- 5V Bus Line -->
<line x1="240" y1="110" x2="780" y2="110" class="bus-power c-5v"/>
<text x="750" y="104" class="lbl c-5v">5V BUS</text>

<!-- GND Bus Line -->
<line x1="100" y1="120" x2="800" y2="120" class="bus-power c-gnd"/>
<text x="770" y="132" class="lbl c-gnd">GND BUS</text>


<!-- ── POWER SECTION BLOCKS (TOP CENTER) ── -->
<rect x="360" y="20" width="280" height="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" rx="4"/>
<text x="500" y="34" class="lbl" fill="#64748b" text-anchor="middle">POWER SUPPLY SECTION</text>

<!-- 12V Adapter -->
<rect x="380" y="40" width="80" height="30" class="block"/>
<text x="420" y="59" class="title" text-anchor="middle">12V DC</text>

<!-- Mini560 -->
<rect x="510" y="40" width="110" height="30" class="block"/>
<text x="565" y="59" class="title" text-anchor="middle">Mini560 (5V)</text>

<!-- Power Connections from/to Adapters -->
<!-- 12V Adapter -> 12V Bus -->
<line x1="400" y1="70" x2="400" y2="100" class="bus-power c-12v"/>
<circle cx="400" cy="100" r="4" class="junction c-12v"/>
<!-- 12V Adapter -> Mini560 IN -->
<line x1="460" y1="55" x2="510" y2="55" class="wire c-12v"/>
<text x="485" y="50" class="lbl c-12v" text-anchor="middle">12V</text>
<!-- Adapter GND -> GND Bus -->
<line x1="440" y1="70" x2="440" y2="120" class="bus-power c-gnd"/>
<circle cx="440" cy="120" r="4" class="junction c-gnd"/>
<!-- Mini560 5V OUT -> 5V Bus -->
<line x1="565" y1="70" x2="565" y2="110" class="bus-power c-5v"/>
<circle cx="565" cy="110" r="4" class="junction c-5v"/>
<!-- Mini560 GND OUT -> GND Bus -->
<line x1="590" y1="70" x2="590" y2="120" class="bus-power c-gnd"/>
<circle cx="590" cy="120" r="4" class="junction c-gnd"/>


<!-- ==========================================
     LEFT COLUMN: MOTOR DRIVER & MOTOR
=========================================== -->
<!-- ── L298N ── -->
<rect x="40" y="180" width="140" height="180" class="block"/>
<text x="110" y="224" class="title" text-anchor="middle">L298N</text>
<text x="110" y="238" class="lbl" text-anchor="middle" fill="#64748b">Motor Driver</text>

<!-- Power Drop from Bus to L298N -->
<!-- 12V Drop -->
<line x1="65" y1="100" x2="65" y2="180" class="wire c-12v"/>
<text x="65" y="196" class="lbl c-12v" text-anchor="middle">12V IN</text>
<!-- GND Drop -->
<line x1="90" y1="120" x2="90" y2="180" class="wire c-gnd"/>
<text x="90" y="196" class="lbl c-gnd" text-anchor="middle">GND</text>

<!-- ENA Jumper Note -->
<rect x="45" y="246" width="130" height="24" fill="#fef08a" stroke="#ca8a04" stroke-width="1" rx="2"/>
<text x="110" y="257" class="lbl" fill="#854d0e" text-anchor="middle">⚠ Remove ENA Jumper!</text>
<text x="110" y="267" class="lbl" fill="#854d0e" text-anchor="middle">Connect ENA → GPIO 26</text>

<!-- Control Pins (Right side of L298N) -->
<text x="175" y="284" class="lbl" text-anchor="end">ENA</text>
<text x="175" y="314" class="lbl" text-anchor="end">IN1</text>
<text x="175" y="344" class="lbl" text-anchor="end">IN2</text>
<line x1="180" y1="280" x2="380" y2="280" class="wire c-dig"/> <!-- ENA -->
<line x1="180" y1="310" x2="380" y2="310" class="wire c-dig"/> <!-- IN1 -->
<line x1="180" y1="340" x2="380" y2="340" class="wire c-dig"/> <!-- IN2 -->

<!-- OUT1 / OUT2 (Bottom of L298N) -->
<text x="70" y="354" class="lbl c-m1" text-anchor="middle">OUT1</text>
<text x="130" y="354" class="lbl c-m2" text-anchor="middle">OUT2</text>
<line x1="70" y1="360" x2="70" y2="440" class="wire c-m1"/>
<line x1="130" y1="360" x2="130" y2="440" class="wire-dashed c-m2"/>


<!-- ── MOTOR ── -->
<rect x="40" y="440" width="180" height="150" class="block"/>
<text x="130" y="460" class="title" text-anchor="middle">JGB37-520 Motor</text>
<text x="130" y="474" class="lbl" text-anchor="middle" fill="#64748b">with Quadrature Encoder</text>

<!-- Motor Power Pins (Top of Motor) -->
<text x="70" y="490" class="lbl c-m1" text-anchor="middle">M+</text>
<text x="130" y="490" class="lbl c-m2" text-anchor="middle">M-</text>

<!-- Motor Encoder Pins (Right side of Motor) -->
<text x="215" y="514" class="lbl c-5v" text-anchor="end">Enc 5V (Red)</text>
<text x="215" y="534" class="lbl c-gnd" text-anchor="end">Enc GND (Black)</text>
<text x="215" y="554" class="lbl c-ha" text-anchor="end">Hall A (Yellow)</text>
<text x="215" y="574" class="lbl c-hb" text-anchor="end">Hall B (Green)</text>

<!-- Routing Motor Encoder Power to Bus (Vertical drops at x=240, 260) -->
<!-- 5V Drop to Motor -->
<line x1="240" y1="110" x2="240" y2="510" class="wire c-5v"/>
<line x1="240" y1="510" x2="220" y2="510" class="wire c-5v"/>
<circle cx="240" cy="110" r="4" class="junction c-5v"/>

<!-- GND Drop to Motor -->
<line x1="260" y1="120" x2="260" y2="530" class="wire c-gnd"/>
<line x1="260" y1="530" x2="220" y2="530" class="wire c-gnd"/>
<circle cx="260" cy="120" r="4" class="junction c-gnd"/>

<!-- Routing Hall Sensors to ESP32 -->
<line x1="220" y1="550" x2="380" y2="550" class="wire c-ha"/> <!-- Hall A -->
<line x1="220" y1="570" x2="380" y2="570" class="wire c-hb"/> <!-- Hall B -->


<!-- ==========================================
     CENTER COLUMN: ESP32 MICROCONTROLLER
=========================================== -->
<rect x="380" y="180" width="240" height="420" class="block"/>
<text x="500" y="210" class="title" font-size="16" text-anchor="middle">ESP32</text>
<text x="500" y="226" class="lbl" text-anchor="middle" fill="#64748b">Microcontroller</text>

<!-- ESP32 Power Pins (Top) -->
<line x1="460" y1="110" x2="460" y2="180" class="wire c-5v"/> <!-- VIN -->
<circle cx="460" cy="110" r="4" class="junction c-5v"/>
<text x="460" y="196" class="lbl c-5v" text-anchor="middle">VIN</text>

<line x1="500" y1="120" x2="500" y2="180" class="wire c-gnd"/> <!-- GND -->
<circle cx="500" cy="120" r="4" class="junction c-gnd"/>
<text x="500" y="196" class="lbl c-gnd" text-anchor="middle">GND</text>

<!-- ESP32 Left Pins -->
<text x="388" y="284" class="lbl">GPIO 26</text>
<text x="388" y="314" class="lbl">GPIO 27</text>
<text x="388" y="344" class="lbl">GPIO 16</text>
<text x="388" y="554" class="lbl">GPIO 34</text>
<text x="388" y="574" class="lbl">GPIO 35</text>

<!-- ESP32 Right Pins -->
<text x="612" y="264" class="lbl" text-anchor="end">GPIO 21</text>
<text x="612" y="294" class="lbl" text-anchor="end">GPIO 22</text>
<text x="612" y="419" class="lbl" text-anchor="end">GPIO 32</text>
<text x="612" y="439" class="lbl" text-anchor="end">GPIO 33</text>
<text x="612" y="459" class="lbl" text-anchor="end">GPIO 25</text>
<text x="612" y="534" class="lbl" text-anchor="end">GPIO 13</text>
<text x="612" y="564" class="lbl" text-anchor="end">GPIO 14</text>

<!-- Routing from ESP32 Right to Modules -->
<line x1="620" y1="260" x2="780" y2="260" class="wire c-i2c"/> <!-- SDA -->
<line x1="620" y1="290" x2="780" y2="290" class="wire c-i2c"/> <!-- SCL -->

<line x1="620" y1="530" x2="780" y2="530" class="wire c-dig"/> <!-- BTN 1 -->
<line x1="620" y1="560" x2="780" y2="560" class="wire c-dig"/> <!-- BTN 2 -->


<!-- ==========================================
     RIGHT COLUMN: OLED, KY-040, BUTTONS
=========================================== -->

<!-- Vertical Power Drop for Right Column -->
<line x1="740" y1="110" x2="740" y2="500" class="wire c-5v"/>
<circle cx="740" cy="110" r="4" class="junction c-5v"/>

<line x1="760" y1="120" x2="760" y2="600" class="wire c-gnd"/>
<circle cx="760" cy="120" r="4" class="junction c-gnd"/>

<!-- ── OLED ── -->
<rect x="780" y="180" width="180" height="130" class="block"/>
<text x="870" y="200" class="title" text-anchor="middle">OLED Display</text>
<text x="870" y="214" class="lbl" text-anchor="middle" fill="#64748b">128x64 (I2C)</text>

<!-- OLED Power -->
<line x1="740" y1="230" x2="780" y2="230" class="wire c-5v"/>
<circle cx="740" cy="230" r="3.5" class="junction c-5v"/>
<text x="788" y="234" class="lbl c-5v">VCC</text>

<line x1="760" y1="245" x2="780" y2="245" class="wire c-gnd"/>
<circle cx="760" cy="245" r="3.5" class="junction c-gnd"/>
<text x="788" y="249" class="lbl c-gnd">GND</text>

<text x="788" y="264" class="lbl c-i2c">SDA</text>
<text x="788" y="294" class="lbl c-i2c">SCL</text>

<!-- ── KY-040 ── -->
<rect x="780" y="320" width="180" height="150" class="block"/>
<text x="870" y="340" class="title" text-anchor="middle">KY-040 Rotary</text>
<text x="870" y="354" class="lbl" text-anchor="middle" fill="#64748b">Encoder</text>

<!-- KY-040 Power -->
<line x1="740" y1="365" x2="780" y2="365" class="wire c-5v"/>
<circle cx="740" cy="365" r="3.5" class="junction c-5v"/>
<text x="788" y="369" class="lbl c-5v">VCC</text>

<line x1="760" y1="395" x2="780" y2="395" class="wire c-gnd"/>
<circle cx="760" cy="395" r="3.5" class="junction c-gnd"/>
<text x="788" y="399" class="lbl c-gnd">GND</text>

<line x1="620" y1="415" x2="780" y2="415" class="wire c-dig"/> <!-- CLK -->
<text x="788" y="419" class="lbl c-dig">CLK</text>

<line x1="620" y1="435" x2="780" y2="435" class="wire c-dig"/> <!-- DT -->
<text x="788" y="439" class="lbl c-dig">DT</text>

<line x1="620" y1="455" x2="780" y2="455" class="wire c-dig"/> <!-- SW -->
<text x="788" y="459" class="lbl c-dig">SW</text>

<!-- ── CONTROL PANEL ── -->
<rect x="780" y="500" width="180" height="90" class="block"/>
<text x="870" y="520" class="title" text-anchor="middle">Control Panel</text>

<!-- Start/Stop Button -->
<text x="788" y="534" class="lbl c-dig">Start/Stop (13)</text>
<rect x="870" y="525" width="12" height="12" fill="none" stroke="#0f172a" rx="2"/>
<line x1="882" y1="530" x2="900" y2="530" class="wire c-gnd"/>
<text x="904" y="534" class="lbl c-gnd">GND</text>

<!-- Reset Button -->
<text x="788" y="564" class="lbl c-dig">Reset (14)</text>
<rect x="870" y="555" width="12" height="12" fill="none" stroke="#0f172a" rx="2"/>
<line x1="882" y1="560" x2="900" y2="560" class="wire c-gnd"/>
<text x="904" y="564" class="lbl c-gnd">GND</text>

<!-- Buttons GND common connection -->
<line x1="900" y1="530" x2="900" y2="580" class="wire c-gnd"/>
<line x1="760" y1="580" x2="900" y2="580" class="wire c-gnd"/>
<circle cx="760" cy="580" r="3.5" class="junction c-gnd"/>


<!-- ==========================================
     COLOR LEGEND (BOTTOM LEFT)
=========================================== -->
<rect x="40" y="620" width="200" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" rx="4"/>
<text x="140" y="638" class="title" text-anchor="middle">Wiring Color Legend</text>
<rect x="50" y="650" width="16" height="10" fill="#dc2626"/>
<text x="75" y="659" class="lbl">Red: 12V / 5V / M+</text>
<rect x="50" y="666" width="16" height="10" fill="#0f172a"/>
<text x="75" y="675" class="lbl">Black: GND</text>
<rect x="50" y="682" width="16" height="10" fill="#2563eb"/>
<text x="75" y="691" class="lbl">Blue: GPIO</text>

<rect x="150" y="650" width="16" height="10" fill="#d97706"/>
<text x="175" y="659" class="lbl">Orange: I2C</text>
<rect x="150" y="666" width="16" height="10" fill="#ca8a04"/>
<text x="175" y="675" class="lbl">Yellow: Hall A</text>
<rect x="150" y="682" width="16" height="10" fill="#16a34a"/>
<text x="175" y="691" class="lbl">Green: Hall B</text>

</svg>
</body>
</html>
